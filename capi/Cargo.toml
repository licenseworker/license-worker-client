[package]
name = "license-worker-client-capi"
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "C ABI for license-worker-client, for C and C++ apps and audio plugins"
repository = "https://github.com/licenseworker/license-worker-client"
publish = false

[lib]
name = "license_worker"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
## KeyringStorage: Windows Credential Manager, macOS Keychain, Linux Secret Service.
keyring = ["license-worker-client/keyring"]

[dependencies]
license-worker-client = { path = "..", version = "0.3.1" }

[dev-dependencies]
cbindgen = { version = "0.29", default-features = false }

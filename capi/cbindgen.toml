language = "C"
include_guard = "LICENSE_WORKER_H"
cpp_compat = true
usize_is_size_t = true
documentation = true
documentation_style = "c99"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
header = """/*
 * license_worker.h: the C interface of license-worker-client.
 * https://github.com/licenseworker/license-worker-client (MIT)
 *
 * Generated by cbindgen from capi/src/lib.rs; do not edit by hand.
 * Regenerate: UPDATE_HEADER=1 cargo test -p license-worker-client-capi --test header
 *
 * Strings in: UTF-8, NUL-terminated, borrowed for the call.
 * Strings out: yours; free them with lw_string_free. Clear an LwStatus with lw_status_clear.
 * No function unwinds into C. Network calls block: never call them on an audio or UI thread.
 */"""

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export]
include = ["LwResult", "LwState", "LwStatus", "LwConfig"]

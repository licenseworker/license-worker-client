[package]
name = "license-worker-client"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Client for License Worker licence servers: activate, check offline-tolerantly with signed Ed25519 licences, deactivate"
repository = "https://github.com/licenseworker/license-worker-client"
readme = "README.md"
keywords = ["license", "licensing", "ed25519", "tauri", "activation"]
categories = ["authentication", "cryptography"]
exclude = [".github/", "capi/", "examples/"]

[features]
default = []
## Store the licence in the OS credential store (Windows Credential Manager, macOS Keychain, Linux Secret Service).
keyring = ["dep:keyring"]

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
gethostname = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# HTTPS: Windows' own TLS (schannel, the system certificate store) on Windows;
# rustls with the webpki roots everywhere else, so Linux needs no OpenSSL.
[target.'cfg(windows)'.dependencies]
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
keyring = { version = "3", optional = true, features = ["windows-native"] }

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", optional = true, features = ["apple-native"] }

[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "3", optional = true, features = ["apple-native"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3", optional = true, features = ["sync-secret-service", "crypto-rust"] }

[[bin]]
name = "license-worker-client"
path = "src/main.rs"

[package.metadata.docs.rs]
all-features = true

[workspace]
members = ["capi"]

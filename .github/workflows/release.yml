name: Release

# On a version tag: builds the C interface for every platform and attaches the
# packages to the GitHub Release of that tag. Each package holds
# include/license_worker.h, the libraries, link-libs.txt (what to link with,
# from rustc itself), README.md and LICENSE.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build the release for, e.g. v0.2.0"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Plain text: link-libs.txt is copied from rustc's output, and colour codes would end up in it.
  CARGO_TERM_COLOR: never
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, crt: md, rustflags: "" }
          - { target: x86_64-pc-windows-msvc, crt: mt, rustflags: "-C target-feature=+crt-static" }
          - { target: aarch64-pc-windows-msvc, crt: md, rustflags: "" }
          - { target: aarch64-pc-windows-msvc, crt: mt, rustflags: "-C target-feature=+crt-static" }
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          cargo rustc --release -p license-worker-client-capi --features keyring --target ${{ matrix.target }} --crate-type staticlib -- --print native-static-libs 2> build.log || { cat build.log; exit 1; }
          cargo build --release -p license-worker-client-capi --features keyring --target ${{ matrix.target }}
          name=license_worker-$TAG-${{ matrix.target }}-${{ matrix.crt }}
          mkdir -p pkg/$name/include pkg/$name/lib
          cp capi/include/license_worker.h pkg/$name/include/
          d=target/${{ matrix.target }}/release
          cp $d/license_worker.lib $d/license_worker.dll $d/license_worker.dll.lib pkg/$name/lib/
          { echo "# Static: link license_worker.lib with these (MSVC, /${{ matrix.crt }} C runtime):";
            grep -o 'native-static-libs: .*' build.log | sed -e 's/native-static-libs: //' -e 's/\x1b\[[0-9;]*m//g' | tail -1; } > pkg/$name/link-libs.txt
          cp capi/README.md LICENSE pkg/$name/
          cd pkg && 7z a -tzip ../$name.zip $name > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}-${{ matrix.crt }}
          path: "*.zip"
          retention-days: 3

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - name: macOS universal
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          # Rust's own strip leaves a dylib the current Apple linker refuses
          # ("mis-aligned LINKEDIT string pool"); Apple's strip runs below instead.
          CARGO_PROFILE_RELEASE_STRIP: "false"
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo rustc --release -p license-worker-client-capi --features keyring --target $t --crate-type staticlib -- --print native-static-libs 2> build-$t.log || { cat build-$t.log; exit 1; }
            cargo build --release -p license-worker-client-capi --features keyring --target $t
          done
          name=license_worker-$TAG-macos-universal
          mkdir -p pkg/$name/include pkg/$name/lib
          cp capi/include/license_worker.h pkg/$name/include/
          lipo -create target/{aarch64,x86_64}-apple-darwin/release/liblicense_worker.a -output pkg/$name/lib/liblicense_worker.a
          # Install name and strip on each slice, then lipo, then an ad-hoc signature
          # (arm64 loads only signed code; sign it with your own identity when you ship).
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            install_name_tool -id @rpath/liblicense_worker.dylib target/$t/release/liblicense_worker.dylib
            xcrun strip -x target/$t/release/liblicense_worker.dylib
          done
          lipo -create target/{aarch64,x86_64}-apple-darwin/release/liblicense_worker.dylib -output pkg/$name/lib/liblicense_worker.dylib
          codesign -f -s - pkg/$name/lib/liblicense_worker.dylib
          { echo "# Static: link liblicense_worker.a with these (macOS 11.0+, arm64 and x86_64):";
            grep -o 'native-static-libs: .*' build-aarch64-apple-darwin.log | sed -e 's/native-static-libs: //' -e 's/\x1b\[[0-9;]*m//g' | tail -1; } > pkg/$name/link-libs.txt
          cp capi/README.md LICENSE pkg/$name/
          # Prove both libraries link and run, as a user would link them.
          cc -O2 -arch arm64 -arch x86_64 -I pkg/$name/include examples/c/lw_cli.c pkg/$name/lib/liblicense_worker.a $(tail -1 pkg/$name/link-libs.txt) -o lw_static
          cc -O2 -arch arm64 -arch x86_64 -I pkg/$name/include examples/c/lw_cli.c -Lpkg/$name/lib -llicense_worker -Wl,-rpath,$PWD/pkg/$name/lib -o lw_dynamic
          examples/c/smoke.sh ./lw_static
          examples/c/smoke.sh ./lw_dynamic
          (cd pkg && zip -qry ../$name.zip $name)
          lipo -info pkg/$name/lib/liblicense_worker.a pkg/$name/lib/liblicense_worker.dylib
      - name: XCFramework (iOS, iOS Simulator, macOS)
        run: |
          capi/build-apple.sh --keyring
          name=LicenseWorker-$TAG.xcframework
          (cd build/apple && zip -qry ../../$name.zip LicenseWorker.xcframework)
          swift package compute-checksum $name.zip > $name.zip.sha256 2>/dev/null || shasum -a 256 $name.zip | cut -d' ' -f1 > $name.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: |
            *.zip
            *.sha256
          retention-days: 3

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      # No keyring here: it would tie every user to libdbus. Use storage_path on Linux.
      - name: Build
        run: |
          cargo rustc --release -p license-worker-client-capi --crate-type staticlib -- --print native-static-libs 2> build.log || { cat build.log; exit 1; }
          cargo build --release -p license-worker-client-capi
          name=license_worker-$TAG-x86_64-linux-gnu
          mkdir -p pkg/$name/include pkg/$name/lib
          cp capi/include/license_worker.h pkg/$name/include/
          cp target/release/liblicense_worker.a target/release/liblicense_worker.so pkg/$name/lib/
          { echo "# Static: link liblicense_worker.a with these (glibc, x86_64; built without the keyring feature):";
            grep -o 'native-static-libs: .*' build.log | sed -e 's/native-static-libs: //' -e 's/\x1b\[[0-9;]*m//g' | tail -1; } > pkg/$name/link-libs.txt
          cp capi/README.md LICENSE pkg/$name/
          cc -O2 -I pkg/$name/include examples/c/lw_cli.c pkg/$name/lib/liblicense_worker.a $(tail -1 pkg/$name/link-libs.txt) -o lw_static
          examples/c/smoke.sh ./lw_static
          tar -C pkg -czf $name.tar.gz $name
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: "*.tar.gz"
          retention-days: 3

  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the changelog
        run: |
          v=${TAG#v}
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          { echo; echo "### Packages"; echo;
            echo "Each package holds \`include/license_worker.h\`, the static library (plugins link this), the shared library, \`link-libs.txt\` and the licence. Windows comes in \`md\` (DLL C runtime, /MD) and \`mt\` (static C runtime, /MT, usual for plugins).";
            echo; echo "The Rust crate itself: \`license-worker-client = { git = \"https://github.com/licenseworker/license-worker-client\", tag = \"$TAG\" }\`."; } >> notes.md
          ls -la dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "license-worker-client $TAG" --notes-file notes.md --verify-tag
          fi
